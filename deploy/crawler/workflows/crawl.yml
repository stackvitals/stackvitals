name: Crawl

on:
  schedule:
    # Backup only: GitHub's schedule is best effort (it skipped most hours here), so each run starts the next one.
    # Minute 37 avoids the busy top of the hour, when GitHub drops the most scheduled runs.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Crawl minutes (the run also stops when the hour's points run out)"
        default: "40"

concurrency:
  group: crawl-state
  cancel-in-progress: false

permissions:
  contents: read
  # Lets a finished run start the next one (the relay).
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MS_DATA_DIR: ${{ github.workspace }}/data
      MS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Crawled data and state backups are kept in the project repo's releases.
      MS_RELEASE_TOKEN: ${{ secrets.MS_STORE_TOKEN }}
      MS_STORE_REPO: kaushik-yadav/merge-scout
    steps:
      # Checkout first: it empties the folder, so the restored state must come after it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore state from the cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[crawl]"
      - name: Restore state from the releases if the cache is gone
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m mergescout.store pull
      - name: Make sure the crawl state is here (stops before anything can be overwritten)
        id: state
        run: |
          if [ ! -s data/crawl.sqlite ]; then
            echo "No crawl state in the cache or the releases; stopping so the good backup is never replaced."
            exit 1
          fi
      - name: Get a token for the MergeScout GitHub App (skipped until the App is set up)
        id: app
        if: vars.MS_APP_ID != ''
        # A hiccup here must not cost the hour: the crawl then runs with the other identities.
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.MS_APP_ID }}
          private-key: ${{ secrets.MS_APP_PRIVATE_KEY }}
      - name: Crawl
        # Leaves time to upload and save even if the process hangs on exit.
        timeout-minutes: 52
        # 12 requests per identity (36 from one runner) drew a 5-minute penalty from GitHub, so 6 each; long waits
        # are sat out (minutes are free in a public repo), and 40 minutes leaves room for one before the hour ends.
        run: python -m mergescout.crawl run --minutes "$CRAWL_MINUTES" --in-flight 6 --max-wait 900
        env:
          # Through env, not pasted into the script, so the input is only ever a value.
          CRAWL_MINUTES: ${{ inputs.minutes || '40' }}
          GITHUB_TOKEN: ${{ secrets.MS_GITHUB_TOKEN }}
          # Extra identities with their own limits: the App (when set up) and this workflow's own token.
          MS_APP_TOKEN: ${{ steps.app.outputs.token }}
          MS_ACTIONS_TOKEN: ${{ github.token }}
      - name: Upload new data and a state backup to releases
        if: always() && steps.state.outcome == 'success'
        run: python -m mergescout.store push
      - name: Save state to the cache
        if: always() && steps.state.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: crawl-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next run (the relay; set the repository variable MS_CHAIN to "off" to stop it)
        if: success() && vars.MS_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          next=$(python -m mergescout.crawl next)
          echo "next: $next"
          # A run that stopped on GitHub's limits pauses before handing over, so the next one finds points again.
          if [ "$next" = "crawl-later" ]; then sleep 600; next=crawl; fi
          if [ "$next" != "none" ]; then gh workflow run "$next.yml" --ref "$REF"; fi
