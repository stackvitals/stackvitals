[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackvitals"
version = "0.2.0"
description = "Free, open-source developer suite: CI health, team flow, dependencies, community, and MergeScout for contributors."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ci", "flaky-tests", "github-actions", "developer-tools", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27", "mcp>=2.3,<3", "zstandard>=0.23", "defusedxml>=0.7", "pyyaml>=6.0",
                "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
# The crawler and the daily pipeline need these; the user tool never does.
# 1.3 is the first DuckDB with the "lambda x:" syntax our SQL uses; checked on 2.0.
sql = ["duckdb>=1.3,<3"]
crawl = ["orjson>=3.10", "pyarrow>=17"]
pipeline = ["orjson>=3.10", "pyarrow>=17", "duckdb>=1.3,<3", "pytz"]
dev = ["pytest>=8", "orjson>=3.10", "pyarrow>=17", "duckdb>=1.3,<3", "pytz"]

[dependency-groups]
# What the GitHub Action installs: the base dependencies without the MCP server's (a test keeps the two in step).
action = ["httpx>=0.27", "zstandard>=0.23", "defusedxml>=0.7", "pyyaml>=6.0", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/stackvitals/stackvitals"
Documentation = "https://github.com/stackvitals/stackvitals/tree/main/docs"
Repository = "https://github.com/stackvitals/stackvitals"
Issues = "https://github.com/stackvitals/stackvitals/issues"
Changelog = "https://github.com/stackvitals/stackvitals/blob/main/CHANGELOG.md"

[project.scripts]
stackvitals = "stackvitals.cli:main"
mergescout = "mergescout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stackvitals", "src/mergescout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real internet; run with MS_NETWORK_TESTS=1"]
