name: Tests
# The committed workflow tests on every pull request, with a read-only token and no secrets.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The web app's build tools, so the suite can rebuild the app and check the committed build is current.
      - name: Install the web app's build tools
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the tests
        run: uv run --locked --extra dev pytest -q
