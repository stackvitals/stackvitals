name: MCP registry
# Lists server.json in the MCP registry after each successful release (or by hand). GitHub's OIDC token proves the
# org namespace, so no token is stored.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.repository == 'stackvitals/stackvitals' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # the registry's GitHub OIDC sign-in
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The released commit, not whatever main holds now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install mcp-publisher (pinned, checksum checked)
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
