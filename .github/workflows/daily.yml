name: Daily

on:
  schedule:
    - cron: "17 5 * * *"
    # Backup in case GitHub skips the first; it stops at once when today's snapshot is already published.
    - cron: "47 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read  # shared benchmark figures arrive as issues

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    # Runs only in the private repo that holds the crawl data; elsewhere the job is skipped.
    if: github.repository == 'kaushik-yadav/merge-scout'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MS_DATA_DIR: ${{ github.workspace }}/data
      MS_RELEASE_TOKEN: ${{ github.token }}
    steps:
      - name: Skip a scheduled run when today's snapshot is already published
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] &&              gh release view "data-$(date -u +%F)" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's snapshot is already published; nothing to do."
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.guard.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Downloaded crawl bundles are kept between runs, so each day fetches only new ones.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.guard.outputs.skip != 'true'
        with:
          path: data/bronze
          key: bronze-${{ github.run_id }}
          restore-keys: bronze-
      - run: pip install ".[pipeline]"
        if: steps.guard.outputs.skip != 'true'
      # The package map is reused for a week per package and OSV advisories until they change, so both sources are asked little.
      - name: Fetch yesterday's package map, vulnerability history and ownership watch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for f in deps-map.json deps-osv.json deps-owners.json; do
            gh release download bench-latest -p "$f" -D out --clobber || echo "no $f yet"
          done
      - name: Build signals and the snapshot from the crawl releases
        id: build
        if: steps.guard.outputs.skip != 'true'
        run: python -m mergescout.snapshot build --from-releases --out out
      # The snapshot first: users depend on it; the signal tables are only an extra copy.
      - name: Publish the snapshot
        if: steps.guard.outputs.skip != 'true'
        run: python -m mergescout.snapshot publish out
      - name: Publish the signal tables
        if: always() && steps.build.outcome == 'success'
        run: python -m mergescout.store put out/signals.tar --tag signals-latest
      # Opt-in figures that teams filed as issues; a group is published only with 10+ repos.
      - name: Build peer groups from shared benchmark figures
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m mergescout.bench.shared --repo "$GITHUB_REPOSITORY" --repo stackvitals/stackvitals --out out/shared-benchmarks.json || echo "shared figures skipped"
      # Each extra is published when it was built; a skipped one keeps yesterday's file.
      - name: Publish the review-flow benchmarks, the triage model, the upgrade ledger and the package map
        if: always() && steps.build.outcome == 'success'
        run: |
          for f in flow-benchmarks.json delivery-benchmarks.json community-benchmarks.json triage-model.json deps-ledger.json deps-map.json watch-repos.txt deps-trends.json deps-osv.json deps-owners.json shared-benchmarks.json; do
            if [ -f "out/$f" ]; then python -m mergescout.store put "out/$f" --tag bench-latest; else echo "out/$f was not built"; fi
          done
      # The Action reads the CI and shared benchmarks from the public repo's release; without its token the copy is skipped.
      - name: Check for the public benchmark token
        id: public_bench
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          PUBLIC_BENCH_TOKEN: ${{ secrets.PUBLIC_BENCH_TOKEN }}
        run: |
          if [ -n "$PUBLIC_BENCH_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "No PUBLIC_BENCH_TOKEN; the public copy is skipped."; fi
      - name: Copy the CI and shared benchmarks to the public release
        if: always() && steps.public_bench.outputs.set == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_BENCH_TOKEN: ${{ secrets.PUBLIC_BENCH_TOKEN }}
        run: |
          mkdir -p public-bench
          for f in ci-benchmarks.json shared-benchmarks.json; do
            gh release download bench-latest -R "$GITHUB_REPOSITORY" -p "$f" -D public-bench --clobber || echo "no $f yet"
          done
          files=$(find public-bench -name '*.json')
          if [ -z "$files" ]; then echo "Nothing to copy."; exit 0; fi
          export GH_TOKEN="$PUBLIC_BENCH_TOKEN"
          gh release view bench-latest -R stackvitals/stackvitals > /dev/null 2>&1 ||
            gh release create bench-latest -R stackvitals/stackvitals --title "Benchmarks" --notes "Peer benchmarks the StackVitals Action compares with, refreshed daily."
          # shellcheck disable=SC2086
          gh release upload bench-latest $files -R stackvitals/stackvitals --clobber
      - name: Sizes
        if: always()
        run: du -sh data out || true
